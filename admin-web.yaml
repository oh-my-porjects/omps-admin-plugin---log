module: log
module_title: 操作日志
menus:
  - key: audit
    title: 审计日志
    icon: file-text
    roles: [admin, developer, operator]
    views: [audit_list]
views:
  - key: audit_list
    type: table
    title: 操作审计
    api: GET /api/log/list
    columns:
      - field: id
        title: ID
      - field: actor
        title: 操作人
      - field: action
        title: 动作
      - field: module
        title: 模块
      - field: created_at
        title: 时间
        render: datetime
      - field: before
        title: 改前
        render: json
      - field: after
        title: 改后
        render: json
    filters:
      - field: actor
        title: 操作人
      - field: action
        title: 动作
      - field: module
        title: 模块
roles:
  - code: admin
    title: 超级管理员
  - code: developer
    title: 开发者
  - code: operator
    title: 运维
