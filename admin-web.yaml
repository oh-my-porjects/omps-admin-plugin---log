module: log
module_title: 操作日志
menus:
- key: audit
  title: 审计日志
  icon: file-text
  views:
  - audit_list
  permission_key: log.audit.page
  default_effect: visible
views:
- key: audit_list
  type: table
  title: 系统审计日志
  api: GET /api/log/list
  columns:
  - field: id
    title: ID
  - field: actor
    title: 操作人
  - field: action
    title: 动作
  - field: module
    title: 模块
  - field: created_at
    title: 时间
    render: datetime
  - field: before
    title: 改前
    render: json
  - field: after
    title: 改后
    render: json
  filters:
  - field: actor
    title: 操作人
  - field: action
    title: 动作
  - field: module
    title: 模块
